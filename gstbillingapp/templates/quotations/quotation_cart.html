{% extends "base.html" %}
{% load static %}
{% block title %}Quotation Cart{% endblock %}

{% block includecss %}
<style>
/* Product Cards */
.product-card {
    border: 1px solid #dee2e6;
    border-radius: 8px;
    transition: box-shadow 0.2s, transform 0.2s;
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
}
.product-card:hover {
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transform: translateY(-2px);
}
.product-card .card-img-top {
    height: 160px;
    object-fit: cover;
}
.product-card .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
}
.product-card .card-actions {
    margin-top: auto;
}

/* Category Section */
.category-section {
    margin-bottom: 15px;
}
.category-header {
    background: #343a40;
    color: #fff;
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.category-header:hover {
    background: #495057;
}
.category-body {
    padding: 10px 0;
}

/* Cart Sidebar */
.cart-sidebar {
    position: sticky;
    top: 70px;
}
.cart-item {
    border-bottom: 1px solid #dee2e6;
    padding: 10px 0;
}
.cart-item:last-of-type {
    border-bottom: none;
}
.cart-item input.form-control {
    font-size: 0.85em;
    padding: 4px 6px;
}
.cart-summary-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 0.9em;
}

/* Badge on cart button */
.cart-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 0.7em;
    padding: 3px 6px;
    border-radius: 50%;
}

/* Responsive tweaks */
@media (max-width: 767px) {
    .product-card .card-img-top {
        height: 120px;
    }
    .product-card .card-body {
        padding: 8px;
    }
    .product-card .card-body h6 {
        font-size: 0.85em;
    }
    .cart-sidebar {
        position: static;
    }
}
</style>
{% endblock %}

{% block content %}
{% csrf_token %}

<!-- Page Header -->
<div class="row mb-3">
    <div class="col">
        <h3><i class="fas fa-shopping-cart"></i> Quotation Cart</h3>
    </div>
    <div class="col text-right" style="padding-top: 0.5%;">
        <button class="btn btn-warning btn-sm btn-curve d-md-none position-relative" onclick="openCart()">
            <i class="fas fa-shopping-bag"></i> Cart
            <span class="badge badge-danger cart-badge" id="cartCountMobile">0</span>
        </button>
    </div>
</div>

<!-- Filter Row -->
<div class="row mb-3">
    <div class="col-md-4 col-6 mb-2">
        <input type="text" id="searchInput" class="form-control" placeholder="Search products..." oninput="applyFilters()">
    </div>
    <div class="col-md-4 col-6 mb-2">
        <select id="categoryFilter" class="form-control" onchange="applyFilters()">
            <option value="">All Categories</option>
        </select>
    </div>
    <div class="col-md-4 col-12 mb-2 d-flex align-items-center justify-content-between">
        <span class="badge badge-primary" id="totalCount" style="font-size:0.9em;">0 Products</span>
        <button class="btn btn-secondary btn-sm btn-curve" onclick="loadData()">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>
</div>

<hr>

<!-- Main Layout: Products + Cart Sidebar -->
<div class="row">
    <!-- Product Listing -->
    <div class="col-md-8 col-lg-9" id="productSection">
        <div id="productContainer"></div>
        <div id="loadingIndicator" class="text-center py-4">
            <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
            <p class="mt-2 text-muted">Loading products...</p>
        </div>
    </div>

    <!-- Cart Sidebar (Desktop) -->
    <div class="col-md-4 col-lg-3 d-none d-md-block">
        <div class="cart-sidebar">
            <div class="card">
                <div class="card-header bg-dark text-white font-weight-bold">
                    <i class="fas fa-shopping-bag"></i> Cart
                    <span class="badge badge-warning float-right" id="cartCount" style="margin-top:2px;">0</span>
                </div>
                <div class="card-body p-2" id="cartItemsDesktop" style="max-height:60vh; overflow-y:auto;">
                    <div class="text-muted text-center py-3">Cart is empty</div>
                </div>
                <div class="card-footer p-2" id="cartFooterDesktop"></div>
            </div>
        </div>
    </div>
</div>

<!-- Cart Modal (Mobile) -->
<div class="modal fade" id="cartModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-shopping-bag"></i> Cart</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body" id="cartItemsMobile"></div>
            <div class="modal-footer d-block" id="cartFooterMobile"></div>
        </div>
    </div>
</div>

{% endblock %}

{% block includejs %}
<script type="text/javascript">
const PRODUCT_API = "{% url 'productsjson' %}";
const CATEGORY_API = "{% url 'categoriesjson' %}";
/* No checkout endpoint exists yet — checkout() refuses to run while this is null
   instead of faking success. Point it at a real URL to enable checkout. */
const CHECKOUT_API = null;

/* Scope the cart to the logged-in user so a second login on the same browser
   does not inherit the previous user's cart. */
const CART_KEY = "quotation_cart_u{{ request.user.id|default:'anon' }}";

let allProducts = [];
let allCategories = [];
let categoryMap = {};
let productMap = {};
let cart = loadCart();
let openCategories = {};   /* category path -> is expanded, preserved across re-renders */

/* ================== HELPERS ================== */

/* Product name / model / image come from user data and are injected as HTML,
   so they must be escaped: a name containing " or < would otherwise break the
   markup or inject script. */
function esc(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function num(value) {
    var n = parseFloat(value);
    return isFinite(n) ? n : 0;
}

function money(value) {
    return num(value).toFixed(2);
}

function loadCart() {
    try {
        var stored = JSON.parse(localStorage.getItem(CART_KEY));
        return Array.isArray(stored) ? stored : [];
    } catch (err) {
        return [];
    }
}

/* ================== LOAD DATA ================== */

async function loadData() {
    $('#loadingIndicator').show();
    try {
        const [pRes, cRes] = await Promise.all([
            fetch(PRODUCT_API, { credentials: 'same-origin' }),
            fetch(CATEGORY_API, { credentials: 'same-origin' })
        ]);
        /* A logged-out session redirects to the login page, which is HTML —
           without this check the JSON parse error looks like a server fault. */
        if (!pRes.ok || !cRes.ok) throw new Error('Request failed');

        allProducts = await pRes.json();
        allCategories = await cRes.json();

        buildCategoryMap();
        buildProductMap();
        buildCategoryDropdown();
        reconcileCart();
        applyFilters();
        updateCartUI();
    } catch (err) {
        console.error('Failed to load data:', err);
        document.getElementById("productContainer").innerHTML =
            '<div class="text-center text-danger py-5"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i>' +
            '<p>Could not load products. Check your connection and try Refresh.</p></div>';
        Swal.fire('Error', 'Failed to load products. Please refresh.', 'error');
    } finally {
        $('#loadingIndicator').hide();
    }
}

/* Cart lives in localStorage, so it can hold products that were since deleted
   or repriced. Drop the dead ones and re-read price/GST from the server copy —
   otherwise the quotation would be built from stale rates. */
function reconcileCart() {
    var removed = 0;
    cart = cart.filter(function(item) {
        var product = productMap[item.id];
        if (!product) {
            removed++;
            return false;
        }
        item.product_name = product.product_name;
        item.model_no = product.model_no;
        item.product_rate_with_gst = num(product.product_rate_with_gst);
        item.product_gst_percentage = num(product.product_gst_percentage);
        item.product_image_url = product.product_image_url;
        item.qty = Math.max(1, Math.floor(num(item.qty)) || 1);
        item.discount = clampDiscount(item.discount);
        return true;
    });

    saveCart();

    if (removed > 0) {
        Swal.fire('Cart Updated', removed + ' item(s) are no longer available and were removed.', 'info');
    }
}

/* ================== CATEGORY TREE ================== */

function buildCategoryMap() {
    categoryMap = {};
    allCategories.forEach(function(cat) {
        categoryMap[cat.id] = cat;
    });
}

function buildProductMap() {
    productMap = {};
    allProducts.forEach(function(p) {
        productMap[p.id] = p;
    });
}

function getCategoryFullPath(catId) {
    if (!catId) return "Uncategorized";
    var path = [];
    var current = categoryMap[catId];
    var guard = 0;
    /* parent_category is a self-FK and nothing stops A -> B -> A in the data,
       so bound the walk rather than hanging the page. */
    while (current && guard++ < 10) {
        path.unshift(current.category_name);
        current = categoryMap[current.parent_category_id];
    }
    return path.length ? path.join(" > ") : "Uncategorized";
}

function buildCategoryDropdown() {
    var dropdown = document.getElementById("categoryFilter");
    var previous = dropdown.value;
    dropdown.innerHTML = '<option value="">All Categories</option>';
    allCategories.forEach(function(cat) {
        var opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = getCategoryFullPath(cat.id);
        dropdown.appendChild(opt);
    });
    dropdown.value = previous;
}

/* ================== FILTER ================== */

function applyFilters() {
    var search = document.getElementById("searchInput").value.trim().toLowerCase();
    var category = document.getElementById("categoryFilter").value;

    var filtered = allProducts.filter(function(p) {
        /* product_name is nullable in the model, so these can be null. */
        var name = (p.product_name || "").toLowerCase();
        var model = (p.model_no || "").toLowerCase();
        var matchSearch = !search || name.indexOf(search) !== -1 || model.indexOf(search) !== -1;
        var matchCategory = !category || String(p.product_category_id) === String(category);
        return matchSearch && matchCategory;
    });

    renderProducts(filtered);
}

/* ================== RENDER PRODUCTS ================== */

function renderProducts(products) {
    var container = document.getElementById("productContainer");
    container.innerHTML = "";

    var hasFilter = document.getElementById("searchInput").value.trim() !== "" ||
                    document.getElementById("categoryFilter").value !== "";

    document.getElementById("totalCount").innerText = products.length + " Products";

    if (products.length === 0) {
        container.innerHTML = '<div class="text-center text-muted py-5"><i class="fas fa-box-open fa-3x mb-3"></i><p>No products found</p></div>';
        return;
    }

    /* Group by category */
    var grouped = {};
    products.forEach(function(p) {
        var categoryName = getCategoryFullPath(p.product_category_id);
        if (!grouped[categoryName]) {
            grouped[categoryName] = { withImage: [], withoutImage: [] };
        }
        if (p.product_image_url) {
            grouped[categoryName].withImage.push(p);
        } else {
            grouped[categoryName].withoutImage.push(p);
        }
    });

    Object.keys(grouped).sort().forEach(function(category, index) {
        var withImg = grouped[category].withImage;
        var withoutImg = grouped[category].withoutImage;
        var collapseId = 'collapseCategory' + index;
        /* Keyed by category path, not by index: the index shifts when the filter
           changes, which would carry one category's open state onto another. */
        var isOpen = openCategories.hasOwnProperty(category) ? openCategories[category] : hasFilter;

        var section = document.createElement('div');
        section.className = 'category-section';
        section.innerHTML =
            '<div class="category-header" data-toggle="collapse" data-target="#' + collapseId + '">' +
                '<span><i class="fas fa-folder-open mr-2"></i>' + esc(category) +
                    ' <span class="badge badge-light">' + (withImg.length + withoutImg.length) + '</span>' +
                '</span>' +
                '<i class="fas ' + (isOpen ? 'fa-chevron-up' : 'fa-chevron-down') + '" id="icon-' + collapseId + '"></i>' +
            '</div>' +
            '<div class="collapse ' + (isOpen ? 'show' : '') + ' category-body" id="' + collapseId + '">' +
                '<div class="row" id="' + collapseId + '-content"></div>' +
            '</div>';

        container.appendChild(section);

        var contentDiv = document.getElementById(collapseId + '-content');

        /* Appended as nodes, never via innerHTML +=, which would re-serialize and
           rebuild every card already in the row (and reload their images). */
        if (withImg.length > 0 && withoutImg.length > 0) {
            contentDiv.appendChild(groupLabel('With Image', 'text-success'));
            withImg.forEach(function(p) { contentDiv.appendChild(createCard(p)); });
            contentDiv.appendChild(groupLabel('Without Image', 'text-secondary', true));
            withoutImg.forEach(function(p) { contentDiv.appendChild(createCard(p)); });
        } else {
            withImg.forEach(function(p) { contentDiv.appendChild(createCard(p)); });
            withoutImg.forEach(function(p) { contentDiv.appendChild(createCard(p)); });
        }

        $('#' + collapseId)
            .on('show.bs.collapse', function() {
                openCategories[category] = true;
                $('#icon-' + collapseId).removeClass('fa-chevron-down').addClass('fa-chevron-up');
            })
            .on('hide.bs.collapse', function() {
                openCategories[category] = false;
                $('#icon-' + collapseId).removeClass('fa-chevron-up').addClass('fa-chevron-down');
            });
    });
}

function groupLabel(text, cssClass, spaced) {
    var div = document.createElement('div');
    div.className = 'col-12 mb-2' + (spaced ? ' mt-3' : '');
    div.innerHTML = '<small class="' + cssClass + ' font-weight-bold"><i class="fas fa-image mr-1"></i>' + text + '</small>';
    return div;
}

/* ================== PRODUCT CARD ================== */

function createCard(product) {
    var col = document.createElement("div");
    col.className = "col-6 col-md-4 col-lg-3 mb-3";
    col.setAttribute('data-product-id', product.id);

    var name = esc(product.product_name || product.model_no || 'Unnamed');

    col.innerHTML =
        '<div class="product-card">' +
            (product.product_image_url ?
                '<img src="' + esc(product.product_image_url) + '" class="card-img-top" alt="' + name + '">'
                : '<div class="card-img-top d-flex align-items-center justify-content-center" style="background:#f0f0f0;height:160px;"><i class="fas fa-box fa-3x text-muted"></i></div>'
            ) +
            '<div class="card-body">' +
                '<h6 class="mb-1 font-weight-bold" style="font-size:0.85em;">' + name + '</h6>' +
                '<small class="text-muted d-block mb-1">Model: ' + esc(product.model_no) + '</small>' +
                '<span class="font-weight-bold text-success">₹ ' + money(product.product_rate_with_gst) + '</span>' +
                '<div class="card-actions">' + cardActionsHtml(product.id) + '</div>' +
            '</div>' +
        '</div>';

    return col;
}

function cardActionsHtml(productId) {
    var cartItem = cart.find(function(c) { return c.id === productId; });

    if (cartItem) {
        return '<div class="mt-2 d-flex align-items-center">' +
                    '<button class="btn btn-danger btn-sm btn-curve" onclick="updateQty(' + productId + ',' + (cartItem.qty - 1) + ')"><i class="fas fa-minus"></i></button>' +
                    '<span class="mx-2 font-weight-bold">' + cartItem.qty + '</span>' +
                    '<button class="btn btn-success btn-sm btn-curve" onclick="addToCart(' + productId + ')"><i class="fas fa-plus"></i></button>' +
                '</div>';
    }
    return '<button class="btn btn-primary btn-sm btn-curve mt-2 btn-block" onclick="addToCart(' + productId + ')">' +
               '<i class="fas fa-cart-plus mr-1"></i>Add' +
           '</button>';
}

/* Repaint only the Add/qty controls. The old code called applyFilters() after
   every cart change, which rebuilt the whole accordion — collapsing every
   category and throwing the user back to the top of the page. */
function refreshCardActions() {
    document.querySelectorAll('#productContainer [data-product-id]').forEach(function(col) {
        var id = parseInt(col.getAttribute('data-product-id'), 10);
        var actions = col.querySelector('.card-actions');
        if (actions) actions.innerHTML = cardActionsHtml(id);
    });
}

/* ================== CART CORE ================== */

function addToCart(id) {
    var product = productMap[id];
    if (!product) return;

    var existing = cart.find(function(p) { return p.id === id; });

    if (existing) {
        existing.qty++;
    } else {
        cart.push({
            id: product.id,
            product_name: product.product_name,
            model_no: product.model_no,
            product_rate_with_gst: num(product.product_rate_with_gst),
            product_gst_percentage: num(product.product_gst_percentage),
            product_image_url: product.product_image_url,
            qty: 1,
            discount: clampDiscount(product.product_discount)
        });
    }

    saveCart();
    refreshCardActions();
}

function saveCart() {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartUI();
}

function updateCartUI() {
    var totalItems = cart.reduce(function(a, b) { return a + b.qty; }, 0);
    $('#cartCount').text(totalItems);
    $('#cartCountMobile').text(totalItems);
    renderCartSidebar();
}

/* ================== CART CALCULATIONS ================== */

/* Matches the invoice formula in main.js: discount comes off the stored rate,
   then GST is added on top of the discounted rate. */
function lineAmounts(item) {
    var price = num(item.product_rate_with_gst);
    var qty = num(item.qty);
    var gross = price * qty;
    var discountAmount = (gross * clampDiscount(item.discount)) / 100;
    var taxable = gross - discountAmount;
    var gstAmount = (taxable * num(item.product_gst_percentage)) / 100;

    return {
        gross: gross,
        discount: discountAmount,
        taxable: taxable,
        gst: gstAmount,
        total: taxable + gstAmount
    };
}

function calculateTotals() {
    var totals = { gross: 0, totalDiscount: 0, taxable: 0, totalGST: 0 };

    cart.forEach(function(item) {
        var line = lineAmounts(item);
        totals.gross += line.gross;
        totals.totalDiscount += line.discount;
        totals.taxable += line.taxable;
        totals.totalGST += line.gst;
    });

    totals.cgst = totals.totalGST / 2;
    totals.sgst = totals.totalGST / 2;
    totals.grandTotal = totals.taxable + totals.totalGST;
    return totals;
}

/* ================== RENDER CART SIDEBAR ================== */

function renderCartSidebar() {
    var html = '';

    if (cart.length === 0) {
        html = '<div class="text-muted text-center py-3"><i class="fas fa-shopping-bag fa-2x mb-2 d-block"></i>Cart is empty</div>';
        $('#cartItemsDesktop').html(html);
        $('#cartItemsMobile').html(html);
        $('#cartFooterDesktop').html('');
        $('#cartFooterMobile').html('');
        return;
    }

    cart.forEach(function(item) {
        var line = lineAmounts(item);

        html +=
            '<div class="cart-item">' +
                '<div class="d-flex justify-content-between align-items-start">' +
                    '<strong style="font-size:0.85em;">' + esc(item.product_name || item.model_no) + '</strong>' +
                    '<button class="btn btn-danger btn-sm" style="padding:0 5px;font-size:0.7em;" onclick="removeFromCart(' + item.id + ')"><i class="fas fa-times"></i></button>' +
                '</div>' +
                '<div class="row mt-1">' +
                    '<div class="col-4 pr-1">' +
                        '<label style="font-size:0.7em;">Qty</label>' +
                        '<input type="number" min="1" step="1" value="' + item.qty + '" class="form-control" onchange="updateQty(' + item.id + ', this.value)">' +
                    '</div>' +
                    '<div class="col-4 px-1">' +
                        '<label style="font-size:0.7em;">Disc %</label>' +
                        '<input type="number" min="0" max="100" step="0.01" value="' + item.discount + '" class="form-control" onchange="updateDiscount(' + item.id + ', this.value)">' +
                    '</div>' +
                    '<div class="col-4 pl-1">' +
                        '<label style="font-size:0.7em;">Total</label>' +
                        '<input type="text" value="₹' + money(line.total) + '" class="form-control" readonly>' +
                    '</div>' +
                '</div>' +
            '</div>';
    });

    $('#cartItemsDesktop').html(html);
    $('#cartItemsMobile').html(html);

    /* Footer with totals. Subtotal is shown gross so that the Discount row below
       it actually subtracts — previously Subtotal was already net of discount
       while a "- Discount" line implied it was still to be taken off. */
    var totals = calculateTotals();
    var footerHtml =
        '<div class="cart-summary-row"><span>Subtotal</span><span>₹ ' + money(totals.gross) + '</span></div>' +
        '<div class="cart-summary-row text-danger"><span>Discount</span><span>- ₹ ' + money(totals.totalDiscount) + '</span></div>' +
        '<div class="cart-summary-row"><span>Taxable Value</span><span>₹ ' + money(totals.taxable) + '</span></div>' +
        '<div class="cart-summary-row"><span>CGST</span><span>₹ ' + money(totals.cgst) + '</span></div>' +
        '<div class="cart-summary-row"><span>SGST</span><span>₹ ' + money(totals.sgst) + '</span></div>' +
        '<hr style="margin:5px 0;">' +
        '<div class="cart-summary-row font-weight-bold" style="font-size:1.1em;"><span>Grand Total</span><span class="text-success">₹ ' + money(totals.grandTotal) + '</span></div>' +
        '<div class="d-flex justify-content-between mt-2">' +
            '<button class="btn btn-outline-danger btn-sm btn-curve" onclick="clearCart()"><i class="fas fa-trash mr-1"></i>Clear</button>' +
            '<button class="btn btn-success btn-sm btn-curve" onclick="checkout()"><i class="fas fa-check mr-1"></i>Checkout</button>' +
        '</div>';

    $('#cartFooterDesktop').html(footerHtml);
    $('#cartFooterMobile').html(footerHtml);
}

/* ================== UPDATE QTY / DISCOUNT ================== */

function removeFromCart(id) {
    cart = cart.filter(function(p) { return p.id !== id; });
    saveCart();
    refreshCardActions();
}

/* Qty input is free text: blanking it or typing letters used to yield "" or NaN.
   "" <= 0 is true in JS, so clearing the box silently deleted the line item, and
   a NaN qty poisoned every total. Removal now only happens through the × button
   or the minus button stepping below 1. */
function updateQty(id, value) {
    var item = cart.find(function(p) { return p.id === id; });
    if (!item) return;

    var qty = Math.floor(num(value));

    if (qty <= 0) {
        removeFromCart(id);
        return;
    }

    item.qty = qty;
    saveCart();
    refreshCardActions();
}

function clampDiscount(value) {
    var d = num(value);
    return Math.min(100, Math.max(0, d));
}

/* A negative discount inflated the total and >100% flipped it negative. */
function updateDiscount(id, value) {
    var item = cart.find(function(p) { return p.id === id; });
    if (!item) return;
    item.discount = clampDiscount(value);
    saveCart();
}

/* ================== CLEAR CART ================== */

function clearCart() {
    Swal.fire({
        title: 'Clear Cart?',
        text: 'This will remove all items from your cart.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Yes, Clear it!'
    }).then(function(result) {
        if (result.isConfirmed) {
            cart = [];
            saveCart();
            refreshCardActions();
        }
    });
}

/* ================== OPEN CART (Mobile Modal) ================== */

function openCart() {
    renderCartSidebar();
    $('#cartModal').modal('show');
}

/* ================== CHECKOUT ================== */

function checkout() {
    if (cart.length === 0) {
        Swal.fire('Empty Cart', 'Add items before checkout.', 'info');
        return;
    }

    /* The old code POSTed to "#", i.e. back to this page. Any 2xx (including this
       page's own HTML) counted as success: it announced "Order placed
       successfully!" and wiped the cart without a quotation ever being created. */
    if (!CHECKOUT_API) {
        Swal.fire('Not Available', 'Checkout is not wired up yet. Your cart has been saved.', 'info');
        return;
    }

    Swal.fire({
        title: 'Confirm Checkout?',
        text: 'Grand Total: ₹ ' + money(calculateTotals().grandTotal),
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#28a745',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Yes, Checkout!'
    }).then(function(result) {
        if (!result.isConfirmed) return;

        fetch(CHECKOUT_API, {
            method: "POST",
            credentials: 'same-origin',
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({ items: cart, totals: calculateTotals() })
        }).then(function(response) {
            return response.json().catch(function() { return { success: response.ok }; });
        }).then(function(data) {
            /* Only clear the cart once the server confirms the quotation exists. */
            if (!data || !data.success) {
                Swal.fire('Error', (data && data.message) || 'Checkout failed. Please try again.', 'error');
                return;
            }
            Swal.fire('Success!', 'Quotation created successfully!', 'success').then(function() {
                cart = [];
                saveCart();
                if (data.redirect_url) {
                    window.location.href = data.redirect_url;
                } else {
                    location.reload();
                }
            });
        }).catch(function() {
            Swal.fire('Error', 'Network error. Please try again.', 'error');
        });
    });
}

/* ================== CSRF ================== */

/* base.html renders <meta name="csrf-token">; the page also has {% csrf_token %}.
   The old selector looked for a csrfmiddlewaretoken input that did not exist,
   so every POST would have gone out with an empty token and been rejected. */
function getCSRFToken() {
    var input = document.querySelector('[name=csrfmiddlewaretoken]');
    if (input && input.value) return input.value;
    var meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.getAttribute('content') : '';
}

$(document).ready(function() {
    loadData();
});
